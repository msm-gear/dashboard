<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MSM Shipment Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">📦</div>
      <h1 class="text-2xl font-bold text-gray-900">MSM Shipment Tracker</h1>
      <p class="text-sm text-gray-500 mt-1">Enter your password to continue</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <form method="POST" action="/public/login?next={{ next_url }}">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input
            type="password"
            name="password"
            autofocus
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent {% if error %}border-red-400{% endif %}"
            placeholder="Enter password"
          />
          {% if error %}
          <p class="text-red-500 text-xs mt-1.5">{{ error }}</p>
          {% endif %}
        </div>
        <button type="submit"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>

</body>
</html>
