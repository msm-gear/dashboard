{% extends "public_base.html" %}
{% block title %}Tracking — MSM Shipment Tracker{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Shipment Tracking</h1>
    <p class="text-gray-500 text-sm mt-1">Live status for all shipments.</p>
  </div>
  <button onclick="loadOrders()"
          class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-sm shadow-sm transition-all">
    <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Reload
  </button>
</div>

<div id="content">
  <div class="flex items-center justify-center py-20 text-gray-400 gap-3">
    <svg class="w-5 h-5 spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Loading…
  </div>
</div>

<script>
const STATUS_COLORS = {
  green:  { bg:'bg-green-100',  text:'text-green-800',  dot:'bg-green-500'  },
  cyan:   { bg:'bg-cyan-100',   text:'text-cyan-800',   dot:'bg-cyan-500'   },
  blue:   { bg:'bg-blue-100',   text:'text-blue-800',   dot:'bg-blue-500'   },
  purple: { bg:'bg-purple-100', text:'text-purple-800', dot:'bg-purple-500' },
  yellow: { bg:'bg-yellow-100', text:'text-yellow-800', dot:'bg-yellow-400' },
  orange: { bg:'bg-orange-100', text:'text-orange-800', dot:'bg-orange-400' },
  red:    { bg:'bg-red-100',    text:'text-red-800',    dot:'bg-red-500'    },
  gray:   { bg:'bg-gray-100',   text:'text-gray-600',   dot:'bg-gray-400'   },
};

const ALL_STATUSES = [
  { tag:'Pending',         label:'Pending',                   color:'gray'   },
  { tag:'LabelCreated',    label:'Label Created',             color:'gray'   },
  { tag:'PickedUp',        label:'Picked Up',                 color:'gray'   },
  { tag:'InTransitIntl',   label:'In Transit (Intl)',         color:'blue'   },
  { tag:'AtCustoms',       label:'At US Customs',             color:'orange' },
  { tag:'ClearedCustoms',  label:'Cleared Customs',           color:'blue'   },
  { tag:'InTransitDom',    label:'In Transit',                color:'blue'   },
  { tag:'OutForDelivery',  label:'Out for Delivery',          color:'orange' },
  { tag:'Delivered',       label:'Delivered',                 color:'green'  },
  { tag:'Exception',       label:'Exception / Delay',         color:'red'    },
];

function badge(label, color) {
  const map = { green:'bg-green-100 text-green-700', blue:'bg-blue-100 text-blue-700',
                orange:'bg-orange-100 text-orange-700', red:'bg-red-100 text-red-700',
                gray:'bg-gray-100 text-gray-600' };
  return `<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${map[color]||map.gray}">${label}</span>`;
}

function fmtRelative(iso) {
  if (!iso) return 'never';
  const diff = Math.round((Date.now() - new Date(iso)) / 60000);
  if (diff < 60) return `${diff}m ago`;
  if (diff < 1440) return `${Math.round(diff/60)}h ago`;
  return `${Math.round(diff/1440)}d ago`;
}

const STEPS = ['LabelCreated','InTransit','OutForDelivery','Delivered'];
function renderStepper(tag) {
  const labels = { LabelCreated:'Label Created', InTransit:'In Transit', OutForDelivery:'Out for Delivery', Delivered:'Delivered' };
  const cur = STEPS.indexOf(tag);
  return `<div class="flex items-center gap-0">${STEPS.map((s,i) => {
    const done = i <= cur;
    const dot = done ? 'bg-blue-500' : 'bg-gray-200';
    const line = i < STEPS.length-1 ? `<div class="flex-1 h-0.5 ${i < cur ? 'bg-blue-400' : 'bg-gray-200'} mx-1"></div>` : '';
    return `<div class="flex items-center"><div class="flex flex-col items-center">
      <div class="w-3 h-3 rounded-full ${dot}"></div>
      <span class="text-xs mt-1 whitespace-nowrap ${done ? 'text-blue-600 font-semibold' : 'text-gray-400'}">${labels[s]}</span>
    </div>${line}</div>`;
  }).join('')}</div>`;
}

const TWO_DAYS_MS  = 2 * 24 * 60 * 60 * 1000;
const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;

function stuckInfo(s, order) {
  if (s.tag === 'Delivered' || s.tag === 'Pending') return null;
  const ref = s.updated_at || (order && order.shipped_at);
  if (!ref) return null;
  const elapsed = Date.now() - new Date(ref);
  if (elapsed < TWO_DAYS_MS) return null;
  return Math.floor(elapsed / 86400000);
}

function customsStuck(s) {
  if (s.tag !== 'ClearedCustoms') return null;
  if (!s.updated_at) return null;
  const elapsed = Date.now() - new Date(s.updated_at);
  if (elapsed < FIVE_DAYS_MS) return null;
  return Math.floor(elapsed / 86400000);
}

const US_STATES = new Set(['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY','DC']);

function extractState(loc) {
  if (!loc) return null;
  const m = loc.match(/,\s*([A-Z]{2})\b/) || loc.match(/\b([A-Z]{2})\s*,/);
  return (m && US_STATES.has(m[1])) ? m[1] : null;
}

function offRoute(s, order) {
  if (!['USTransit','OutForDelivery'].includes(s.tag)) return null;
  if (!order || !order.dest_state || !s.location) return null;
  const locState = extractState(s.location);
  if (!locState || locState === order.dest_state) return null;
  const HUB_STATES = new Set(['TN','IN','TX','CA','IL','OH','GA','NY','NJ']);
  if (HUB_STATES.has(locState)) return null;
  return { locationState: locState, destState: order.dest_state, location: s.location };
}

function carrierUrl(tn, carrier) {
  if ((carrier||'').toLowerCase().includes('ups')) return `https://www.ups.com/track?tracknum=${tn}`;
  return `https://www.fedex.com/fedextrack/?trknbr=${tn}`;
}

// ── Tracking Summary table ────────────────────────────────────────────────────
let _summaryCollapsed = false;

function renderSummaryTable(orders) {
  const rows = [];
  orders.forEach(order => order.shipments.forEach(s => rows.push({ s, order })));
  if (!rows.length) return '';
  const rank = tag => tag === 'Delivered' ? 2 : tag === 'Pending' ? 1 : 0;
  rows.sort((a, b) => rank(a.s.tag) - rank(b.s.tag));

  const STATUS_EMOJI = { Pending:'⏳',LabelCreated:'🏷️',PickedUp:'📬',InTransitIntl:'✈️',AtCustoms:'🛃',ClearedCustoms:'✅',InTransitDom:'🚛',OutForDelivery:'🚚',Delivered:'📦',Exception:'🚨' };

  const rowsHtml = rows.map(({ s, order }) => {
    const info    = ALL_STATUSES.find(st => st.tag === s.tag) || { label: s.tag, color: 'gray' };
    const c       = STATUS_COLORS[info.color] || STATUS_COLORS.gray;
    const emoji   = STATUS_EMOJI[s.tag] || '📦';
    const gearList = (s.gear_groups && s.gear_groups.length) ? s.gear_groups
      : (s.gear_summary || []).filter(g => g.boxes > 0).map(g => `${g.gear} × ${g.boxes} box${g.boxes !== 1 ? 'es' : ''}`);
    const gearStr  = gearList.join(' · ') || '—';
    const locStr   = s.location ? ` (${s.location})` : '';
    const dateStr  = s.updated_at ? new Date(s.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
    const isCustoms = !!customsStuck(s);
    const isStuck   = !!stuckInfo(s, order);
    const isRoute   = !!offRoute(s, order);
    const alertDot  = isCustoms ? '<span class="w-1.5 h-1.5 rounded-full bg-red-500 inline-block mr-1"></span>'
                    : isStuck   ? '<span class="w-1.5 h-1.5 rounded-full bg-orange-400 inline-block mr-1"></span>'
                    : isRoute   ? '<span class="w-1.5 h-1.5 rounded-full bg-yellow-400 inline-block mr-1"></span>' : '';
    return `<tr class="border-t border-gray-100 hover:bg-gray-50">
      <td class="px-4 py-2.5 whitespace-nowrap">
        <div class="flex items-center gap-1">${alertDot}
          <a href="${carrierUrl(s.tracking_number, s.carrier)}" target="_blank"
             class="font-mono text-blue-600 hover:underline text-xs font-semibold">${s.tracking_number}</a>
        </div>
      </td>
      <td class="px-4 py-2.5 text-xs text-gray-700 whitespace-nowrap">
        <span class="font-semibold">${order.market}</span>
        <span class="text-gray-400"> ${order.season} ${order.sport} · #${order.order_num}</span>
      </td>
      <td class="px-4 py-2.5 text-xs text-gray-600 max-w-xs truncate">${gearStr}</td>
      <td class="px-4 py-2.5 whitespace-nowrap">
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${c.bg} ${c.text}">
          ${emoji} ${info.label}${locStr}
        </span>
      </td>
      <td class="px-4 py-2.5 text-xs text-gray-400 whitespace-nowrap">${dateStr}</td>
    </tr>`;
  }).join('');

  const deliveredCount = rows.filter(r => r.s.tag === 'Delivered').length;
  const totalCount     = rows.length;

  return `
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm mb-6 overflow-hidden">
    <div class="px-5 py-3 flex items-center justify-between bg-gray-50 border-b border-gray-100 cursor-pointer select-none"
         onclick="toggleSummary()">
      <div class="flex items-center gap-3">
        <span class="font-semibold text-gray-800 text-sm">Tracking Summary</span>
        <span class="text-xs text-gray-400">${totalCount} shipment${totalCount !== 1 ? 's' : ''} · ${deliveredCount} delivered</span>
      </div>
      <span id="summary-chevron" class="text-gray-400 text-sm transition-transform ${_summaryCollapsed ? '' : 'rotate-180'}">▼</span>
    </div>
    <div id="summary-body" class="${_summaryCollapsed ? 'hidden' : ''}">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead><tr class="text-xs font-semibold text-gray-400 uppercase tracking-wide">
            <th class="px-4 py-2">Tracking #</th><th class="px-4 py-2">Order</th>
            <th class="px-4 py-2">Contents</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Date</th>
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function toggleSummary() {
  _summaryCollapsed = !_summaryCollapsed;
  document.getElementById('summary-body')?.classList.toggle('hidden', _summaryCollapsed);
  document.getElementById('summary-chevron')?.classList.toggle('rotate-180', !_summaryCollapsed);
}

function renderShipment(s, order, idx) {
  const info  = ALL_STATUSES.find(st => st.tag === s.tag) || { label: s.status_label, color: 'gray' };
  const stuck = stuckInfo(s);
  const gearTags = s.gear_summary.map(g =>
    `<span class="inline-block bg-gray-100 text-gray-700 text-xs px-2.5 py-1 rounded-full font-medium">${g.label || g.gear} × ${g.boxes} box${g.boxes !== 1 ? 'es' : ''}</span>`
  ).join(' ');
  const updatedStr = fmtRelative(s.updated_at);
  const stuckBanner = stuck ? `
    <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-lg px-3 py-2 mb-3 text-sm text-orange-800">
      <span>⚠️</span>
      <span>No update for <strong>${stuck} day${stuck!==1?'s':''}</strong></span>
      <a href="${carrierUrl(s.tracking_number, s.carrier)}" target="_blank" class="ml-auto text-orange-700 font-semibold underline">Check FedEx →</a>
    </div>` : '';
  const cardBorder = stuck ? 'border-orange-300 bg-orange-50/30' : 'border-gray-100 bg-white';

  return `
  <div class="border ${cardBorder} rounded-xl p-4 mb-3 hover:shadow-sm transition-shadow">
    ${stuckBanner}
    <div class="flex items-start justify-between gap-4 mb-4">
      <div>
        <a href="${carrierUrl(s.tracking_number, s.carrier)}" target="_blank" rel="noopener"
           class="font-mono text-blue-600 hover:underline font-semibold text-base">${s.tracking_number}</a>
        <span class="text-gray-400 text-xs ml-2">${s.carrier.toUpperCase()}</span>
        <div class="flex flex-wrap gap-1.5 mt-2">${gearTags}</div>
      </div>
      <div class="text-right flex-shrink-0 flex flex-col items-end gap-1.5">
        ${badge(info.label, info.color)}
        <div class="text-xs text-gray-400">Updated ${updatedStr}</div>
      </div>
    </div>
    <div class="mb-2 px-1">${renderStepper(s.tag)}</div>
    ${s.notes ? `<p class="text-xs text-gray-500 pt-2 border-t border-gray-100 mt-2">${s.notes}</p>` : ''}
    ${s.delivered_at ? `<p class="text-xs text-green-600 font-semibold pt-2">✓ Delivered ${s.delivered_at.split('T')[0]}</p>` : ''}
  </div>`;
}

function renderOrder(order) {
  const deliveredCount = order.shipments.filter(s => s.tag === 'Delivered').length;
  const total          = order.shipments.length;
  const allDone        = total > 0 && deliveredCount === total;
  const stuckCount     = order.shipments.filter(s => stuckInfo(s, order)).length;
  const customsCount   = order.shipments.filter(s => customsStuck(s)).length;
  const routeCount     = order.shipments.filter(s => offRoute(s, order)).length;
  const progressColor  = allDone ? 'text-green-600 font-semibold' : 'text-gray-500';
  const cards = order.shipments.length === 0
    ? `<p class="text-gray-400 text-sm py-4">No tracking numbers on record.</p>`
    : order.shipments.map((s, i) => renderShipment(s, order, i)).join('');
  return `
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm mb-6 overflow-hidden">
    <div class="px-5 py-4 flex items-center justify-between bg-gray-50 border-b border-gray-100">
      <div>
        <span class="font-bold text-gray-900 text-lg">${order.market}</span>
        <span class="text-gray-500 text-sm ml-2">${order.season} ${order.sport} · Order #${order.order_num}</span>
      </div>
      <div class="flex items-center gap-3">
        ${customsCount ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800">🛃 ${customsCount} customs</span>` : ''}
        ${stuckCount ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-orange-100 text-orange-800">⚠️ ${stuckCount} stuck</span>` : ''}
        ${routeCount ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800">🗺️ ${routeCount} off route</span>` : ''}
        <span class="text-sm ${progressColor}">${deliveredCount}/${total} delivered</span>
      </div>
    </div>
    <div class="p-4">${cards}</div>
    ${renderPackingDocs(order)}
  </div>`;
}

async function loadOrders() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spin');
  try {
    const resp = await fetch('/api/tracking-status');
    const data = await resp.json();
    const container = document.getElementById('content');
    const orders = data.orders || [];
    const withShipments = orders.filter(o => o.shipments?.length);
    if (!withShipments.length) {
      container.innerHTML = '<p class="text-center text-gray-400 py-12">No shipments yet.</p>';
      return;
    }
    const totalCustoms = withShipments.reduce((n, o) => n + o.shipments.filter(s => customsStuck(s)).length, 0);
    const totalStuck   = withShipments.reduce((n, o) => n + o.shipments.filter(s => stuckInfo(s, o)).length, 0);
    const totalRoute   = withShipments.reduce((n, o) => n + o.shipments.filter(s => offRoute(s, o)).length, 0);
    const alertLines = [];
    if (totalCustoms) alertLines.push(`🛃 <strong>${totalCustoms} shipment${totalCustoms !== 1 ? 's' : ''}</strong> stuck at customs 5+ days`);
    if (totalStuck)   alertLines.push(`⚠️ <strong>${totalStuck} shipment${totalStuck !== 1 ? 's' : ''}</strong> with no update for 2+ days`);
    if (totalRoute)   alertLines.push(`🗺️ <strong>${totalRoute} shipment${totalRoute !== 1 ? 's' : ''}</strong> may be off route`);
    const topAlert = alertLines.length
      ? `<div class="bg-orange-50 border border-orange-200 rounded-xl px-5 py-3 mb-5 flex flex-col gap-1 text-sm text-orange-800">${alertLines.map(l => `<div>${l}</div>`).join('')}</div>` : '';
    const summary = renderSummaryTable(withShipments);
    container.innerHTML = topAlert + summary + withShipments.map(renderOrder).join('');
  } finally {
    icon.classList.remove('spin');
  }
}
loadOrders();
setInterval(loadOrders, 60000);

// ── Packing Docs (read-only) ──────────────────────────────────────────────────
function renderPackingDocs(order) {
  const docs = order.packing_docs || [];
  if (!docs.length) return '';
  const rows = docs.map(d => `
    <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
      <div class="flex items-center gap-2 min-w-0">
        <svg class="w-4 h-4 text-[#1a2b6b] flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span class="text-sm text-gray-700 font-medium truncate">${d.label}</span>
      </div>
      <div class="flex items-center gap-1.5 flex-shrink-0 ml-3">
        <a href="/packing-doc/${order.id}/${encodeURIComponent(d.filename)}" target="_blank"
           class="text-xs font-semibold text-[#1a2b6b] px-3 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 transition">View</a>
        <a href="/packing-doc/${order.id}/${encodeURIComponent(d.filename)}?dl=1" download="${d.download_name || d.filename}"
           class="text-xs font-semibold text-gray-600 px-3 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 transition">Download</a>
      </div>
    </div>`).join('');
  return `
  <div class="border-t border-gray-100 px-5 py-3">
    <div class="mb-2">
      <span class="text-xs font-bold text-gray-500 uppercase tracking-wide">Packing Lists</span>
    </div>
    ${rows}
  </div>`;
}
</script>
{% endblock %}
