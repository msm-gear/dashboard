{% extends "public_base.html" %}
{% block title %}Tracking — MSM Shipment Tracker{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Shipment Tracking</h1>
    <p class="text-gray-500 text-sm mt-1">Live status for all shipments.</p>
  </div>
  <button onclick="loadOrders()"
          class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg text-sm shadow-sm transition-all">
    <svg id="refreshIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Reload
  </button>
</div>

<div id="content">
  <div class="flex items-center justify-center py-20 text-gray-400 gap-3">
    <svg class="w-5 h-5 spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Loading…
  </div>
</div>

<script>
const ALL_STATUSES = [
  { tag:'Pending',         label:'Pending',          color:'gray'   },
  { tag:'LabelCreated',    label:'Label Created',     color:'gray'   },
  { tag:'InTransit',       label:'In Transit',        color:'blue'   },
  { tag:'InTransitIntl',   label:'In Transit (Intl)', color:'blue'   },
  { tag:'OutForDelivery',  label:'Out for Delivery',  color:'orange' },
  { tag:'Delivered',       label:'Delivered',         color:'green'  },
  { tag:'Exception',       label:'Exception',         color:'red'    },
  { tag:'Expired',         label:'Expired',           color:'red'    },
];

function badge(label, color) {
  const map = { green:'bg-green-100 text-green-700', blue:'bg-blue-100 text-blue-700',
                orange:'bg-orange-100 text-orange-700', red:'bg-red-100 text-red-700',
                gray:'bg-gray-100 text-gray-600' };
  return `<span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold ${map[color]||map.gray}">${label}</span>`;
}

function fmtRelative(iso) {
  if (!iso) return 'never';
  const diff = Math.round((Date.now() - new Date(iso)) / 60000);
  if (diff < 60) return `${diff}m ago`;
  if (diff < 1440) return `${Math.round(diff/60)}h ago`;
  return `${Math.round(diff/1440)}d ago`;
}

const STEPS = ['LabelCreated','InTransit','OutForDelivery','Delivered'];
function renderStepper(tag) {
  const labels = { LabelCreated:'Label Created', InTransit:'In Transit', OutForDelivery:'Out for Delivery', Delivered:'Delivered' };
  const cur = STEPS.indexOf(tag);
  return `<div class="flex items-center gap-0">${STEPS.map((s,i) => {
    const done = i <= cur;
    const dot = done ? 'bg-blue-500' : 'bg-gray-200';
    const line = i < STEPS.length-1 ? `<div class="flex-1 h-0.5 ${i < cur ? 'bg-blue-400' : 'bg-gray-200'} mx-1"></div>` : '';
    return `<div class="flex items-center"><div class="flex flex-col items-center">
      <div class="w-3 h-3 rounded-full ${dot}"></div>
      <span class="text-xs mt-1 whitespace-nowrap ${done ? 'text-blue-600 font-semibold' : 'text-gray-400'}">${labels[s]}</span>
    </div>${line}</div>`;
  }).join('')}</div>`;
}

function stuckInfo(s) {
  if (!s.updated_at || ['Delivered','Exception','Expired'].includes(s.tag)) return null;
  const days = Math.round((Date.now() - new Date(s.updated_at)) / 86400000);
  return days >= 3 ? days : null;
}

function carrierUrl(tn, carrier) {
  if ((carrier||'').toLowerCase().includes('ups')) return `https://www.ups.com/track?tracknum=${tn}`;
  return `https://www.fedex.com/fedextrack/?trknbr=${tn}`;
}

function renderShipment(s, order, idx) {
  const info  = ALL_STATUSES.find(st => st.tag === s.tag) || { label: s.status_label, color: 'gray' };
  const stuck = stuckInfo(s);
  const gearTags = s.gear_summary.map(g =>
    `<span class="inline-block bg-gray-100 text-gray-700 text-xs px-2.5 py-1 rounded-full font-medium">${g.gear} × ${g.boxes} box${g.boxes !== 1 ? 'es' : ''}</span>`
  ).join(' ');
  const updatedStr = fmtRelative(s.updated_at);
  const stuckBanner = stuck ? `
    <div class="flex items-center gap-2 bg-orange-50 border border-orange-200 rounded-lg px-3 py-2 mb-3 text-sm text-orange-800">
      <span>⚠️</span>
      <span>No update for <strong>${stuck} day${stuck!==1?'s':''}</strong></span>
      <a href="${carrierUrl(s.tracking_number, s.carrier)}" target="_blank" class="ml-auto text-orange-700 font-semibold underline">Check FedEx →</a>
    </div>` : '';
  const cardBorder = stuck ? 'border-orange-300 bg-orange-50/30' : 'border-gray-100 bg-white';

  return `
  <div class="border ${cardBorder} rounded-xl p-4 mb-3 hover:shadow-sm transition-shadow">
    ${stuckBanner}
    <div class="flex items-start justify-between gap-4 mb-4">
      <div>
        <a href="${carrierUrl(s.tracking_number, s.carrier)}" target="_blank" rel="noopener"
           class="font-mono text-blue-600 hover:underline font-semibold text-base">${s.tracking_number}</a>
        <span class="text-gray-400 text-xs ml-2">${s.carrier.toUpperCase()}</span>
        <div class="flex flex-wrap gap-1.5 mt-2">${gearTags}</div>
      </div>
      <div class="text-right flex-shrink-0 flex flex-col items-end gap-1.5">
        ${badge(info.label, info.color)}
        <div class="text-xs text-gray-400">Updated ${updatedStr}</div>
      </div>
    </div>
    <div class="mb-2 px-1">${renderStepper(s.tag)}</div>
    ${s.notes ? `<p class="text-xs text-gray-500 pt-2 border-t border-gray-100 mt-2">${s.notes}</p>` : ''}
    ${s.delivered_at ? `<p class="text-xs text-green-600 font-semibold pt-2">✓ Delivered ${s.delivered_at.split('T')[0]}</p>` : ''}
  </div>`;
}

async function loadOrders() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spin');
  try {
    const resp = await fetch('/api/shipments');
    const data = await resp.json();
    const container = document.getElementById('content');
    if (!data.length) {
      container.innerHTML = '<p class="text-center text-gray-400 py-12">No shipments yet.</p>';
      return;
    }
    container.innerHTML = data.map(order => {
      if (!order.shipments?.length) return '';
      return `
        <div class="mb-6">
          <p class="text-sm font-semibold text-gray-600 mb-2">${order.market} ${order.season} ${order.sport} #${order.order_num}</p>
          ${order.shipments.map((s, i) => renderShipment(s, order, i)).join('')}
        </div>`;
    }).join('');
  } finally {
    icon.classList.remove('spin');
  }
}
loadOrders();
</script>
{% endblock %}
