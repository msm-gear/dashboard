<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MSM Shipment Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head_extra %}{% endblock %}
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .btn { @apply inline-flex items-center gap-2 px-4 py-2 rounded-lg font-semibold text-sm transition-all; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 text-gray-900 font-bold text-lg no-underline">
      <span class="text-2xl">📦</span>
      <span>MSM Shipment Tracker</span>
    </a>
    <div class="flex items-center gap-5">
      <a href="/" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        📂 Upload Packing List
      </a>
      <a href="/order-form" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        📋 New Order
      </a>
      <a href="/orders" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        🗂 My Orders
      </a>
      <a href="/tracking" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        🚚 Tracking
      </a>
      <a href="/contents" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        🔍 Contents
      </a>
      <a href="/calendar" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        📅 Calendar
      </a>
      <a href="/dashboard" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        📊 Dashboard
      </a>
      <a href="/packing-verifier" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        ✅ Packing Verifier
      </a>
      <a href="/inventory" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        📦 Inventory
      </a>
      <a href="/settings" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        ⚙️ Settings
      </a>
      <a href="http://localhost:5006" target="_blank" class="text-sm text-gray-500 hover:text-gray-800 flex items-center gap-1">
        🎨 Gear Catalog
      </a>
    </div>
  </nav>

  {% block full_width %}{% endblock %}
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
