<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MSM Order Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">📋</div>
      <h1 class="text-2xl font-bold text-gray-900">MSM Order Sheet</h1>
      <p class="text-sm text-gray-500 mt-1">Enter your password to continue</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 mb-4 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200">
            <th class="text-left px-4 py-2.5 font-semibold text-gray-600">Role</th>
            <th class="text-left px-4 py-2.5 font-semibold text-gray-600">Tool Access</th>
            <th class="text-left px-4 py-2.5 font-semibold text-gray-600">Password</th>
          </tr>
        </thead>
        <tbody>
          <tr class="border-b border-gray-100">
            <td class="px-4 py-2.5 font-medium text-gray-800">MSM Internal</td>
            <td class="px-4 py-2.5 text-gray-500">All msm-hq tools</td>
            <td class="px-4 py-2.5 font-mono text-xs text-gray-700">GearUp@MSM2026</td>
          </tr>
          <tr>
            <td class="px-4 py-2.5 font-medium text-gray-800">Zee</td>
            <td class="px-4 py-2.5 text-gray-500">Order Sheet</td>
            <td class="px-4 py-2.5 font-mono text-xs text-gray-700">GearUp2Sell26!</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <form method="POST" action="/public/orders-login">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input
            type="password"
            name="password"
            autofocus
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent {% if error %}border-red-400{% endif %}"
            placeholder="Enter password"
          />
          {% if error %}
          <p class="text-red-500 text-xs mt-1.5">{{ error }}</p>
          {% endif %}
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-colors">
          Sign In
        </button>
      </form>
    </div>
  </div>

</body>
</html>
